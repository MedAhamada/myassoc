security:
    password_hashers:
        App\Entity\Admin: 'auto'

    providers:
        admins:
            entity:
                class: App\Entity\Admin
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Public, unauthenticated verification endpoint (QR code target).
        public:
            pattern: ^/api/public/
            security: false
            stateless: true

        # Credential exchange: POST /api/auth/login with { email, password } -> JWT.
        login:
            pattern: ^/api/auth/login
            stateless: true
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api/
            stateless: true
            provider: admins
            jwt: ~

    access_control:
        - { path: ^/api/public/, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            App\Entity\Admin:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
