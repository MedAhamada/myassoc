services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-myassoc}
      MYSQL_USER: ${MYSQL_USER:-myassoc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-!ChangeMeRoot!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-!ChangeMeRoot!}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailer:
        condition: service_started
    volumes:
      - ./backend:/var/www/backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-myassoc}:${MYSQL_PASSWORD:-!ChangeMe!}@mysql:3306/${MYSQL_DATABASE:-myassoc}?serverVersion=8.0.37&charset=utf8mb4"
      # Routes every outgoing e-mail (membership cards, ...) to the mailhog
      # service instead of null://null, so they're actually viewable at
      # http://localhost:8025 in dev.
      MAILER_DSN: "smtp://mailer:1025"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - nginx
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
      # Used only for the server-rendered /verify/[uuid] page: from inside the
      # compose network, the backend is reached via the nginx service, not
      # through the host's published localhost:8000 port.
      INTERNAL_API_URL: "http://nginx/api"
    command: sh -c "npm install && npm run dev"

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  mailer:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
